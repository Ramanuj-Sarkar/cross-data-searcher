# Install once with:  pip install -e ".[dev]" && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^results/
      - id: end-of-file-fixer
        exclude: ^results/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system   # uses the dev environment's numpy so numpy's types resolve
        types: [python]
        pass_filenames: false
