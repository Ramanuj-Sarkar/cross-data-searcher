[project]
name = "prism-demo-searcher"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[project.scripts]
prism = "prism.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
prism = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# the codebase deliberately uses compact `a; b` statements
ignore = ["E701", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.10"
files = ["prism", "bench.py"]
check_untyped_defs = true  # the codebase is mostly unannotated; still type-check function bodies
warn_unused_ignores = true
warn_redundant_casts = true
